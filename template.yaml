AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: EventPulse - serverless event ingestion platform. Tier A spine (ST-6).

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]

Globals:
  Function:
    Runtime: python3.12
    Timeout: 15
    MemorySize: 128
    Handler: app.lambda_handler

Resources:
  EventsBucket:
    Type: AWS::S3::Bucket
    Properties:
      # Deterministic, globally unique, env-scoped; prod uses the same scheme.
      BucketName: !Sub "eventpulse-events-${AWS::Region}-${AWS::AccountId}-${Environment}"

  EventApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod

  ApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Name: !Sub "eventpulse-${Environment}-key"
      Enabled: true
      GenerateDistinctId: true
      StageKeys:
        - RestApiId: !Ref EventApi
          StageName: Prod
      # No Value property: API Gateway generates the key secret, so nothing
      # sensitive ever lives in the template. Fetch post-deploy via
      # aws apigateway get-api-key --api-key <id> --include-value.

  UsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    Properties:
      Throttle:
        BurstLimit: 200
        RateLimit: 100
      ApiStages:
        - ApiId: !Ref EventApi
          Stage: Prod

  UsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      UsagePlanId: !Ref UsagePlan
      KeyId: !Ref ApiKey
      KeyType: API_KEY

  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/ingest
      Events:
        PostEvents:
          Type: Api
          Properties:
            RestApiId: !Ref EventApi
            Path: /events
            Method: post
            Auth:
              ApiKeyRequired: true
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Sid: PutEventsObjects
              Effect: Allow
              Action:
                - s3:PutObject
              Resource:
                - !Sub "${EventsBucket.Arn}/*"
      Environment:
        Variables:
          EVENTS_BUCKET: !Ref EventsBucket

Outputs:
  ApiEndpoint:
    Description: Tier A REST API invoke URL
    Value: !Sub "https://${EventApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  ApiKeyId:
    Description: Key ID for the events API key; fetch value with get-api-key --include-value
    Value: !Ref ApiKey
  EventsBucketName:
    Description: S3 events bucket
    Value: !Ref EventsBucket